name: medical-rag-agent
services:
  # ---------------------------------------------------------------------------
  # Vector database - self-hosted by default, i.e. plain `docker compose up -d`
  # pulls and runs it. To use a managed cluster instead, skip this container
  # with `--scale qdrant=0` and set QDRANT_URL / QDRANT_API_KEY.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: medical-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard -> http://localhost:6333/dashboard
      - "6334:6334"   # gRPC API
    volumes:
      # Pre-built index shipped with the repo: the Medical Book is already
      # embedded, so startup skips ingestion entirely. Point QDRANT_STORAGE
      # at any other path (an empty dir, or a named volume) to start from a
      # blank index and re-ingest from the PDF - see README, "Pre-built
      # Qdrant index".
      - ${QDRANT_STORAGE:-./docs/prebuilt_qdrant_data}:/qdrant/storage
    networks:
      - medical-net
    healthcheck:
      # qdrant image ships no curl/wget; probe the REST port over a TCP open.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Streamlit application (planner -> rag -> evaluator -> reviser -> summarizer)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: medical-rag-agent:latest
    container_name: medical-rag-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
        # `required: false` is what makes `--scale qdrant=0` (managed-cluster
        # mode) work: without it Compose refuses to start app with no qdrant.
        required: false
    environment:
      # Required: the LLM key, injected from the host, never committed.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-}
      MEDICAL_PDF_PATH: docs/Medical_Book.pdf
    ports:
      - "8501:8501"   # Streamlit UI -> http://localhost:8501
    volumes:
      - ./config:/app/config:ro
      # Embedding model download (~1 GB) - fetched once, reused after that.
      - hf-cache:/home/appuser/.cache/huggingface
      # Debug log (app/utils/logger.py -> logs/medical_generative.log).
      - app-logs:/app/logs
    networks:
      - medical-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  hf-cache:
  app-logs:

networks:
  medical-net:
    driver: bridge