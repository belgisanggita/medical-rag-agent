name: medical-rag-agent

services:
  # ---------------------------------------------------------------------------
  # Vector database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: medical-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard -> http://localhost:6333/dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - medical-net
    healthcheck:
      # qdrant image ships no curl/wget; probe the REST port over a TCP open.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Streamlit application (planner -> rag -> evaluator -> reviser -> summarizer)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: medical-rag-agent:latest
    container_name: medical-rag-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      # These override anything in properties.env: real env vars take
      # precedence over python-dotenv, so the app always talks to the
      # qdrant service and finds the bundled PDF regardless of local edits.
      QDRANT_URL: http://qdrant:6333
      MEDICAL_PDF_PATH: docs/Medical_Book.pdf
    ports:
      - "8501:8501"   # Streamlit UI -> http://localhost:8501
    volumes:
      # Secrets / tuning knobs - read by the app's own load_dotenv().
      # Whole dir is mounted (not the single file) so a missing
      # properties.env surfaces as a clean app-side config error instead
      # of Docker silently creating a directory in its place.
      - ./config:/app/config:ro
      # Embedding model download (~1 GB) - fetched once, reused after that.
      - hf-cache:/home/appuser/.cache/huggingface
      # Debug log (app/utils/logger.py -> logs/medical_generative.log).
      - app-logs:/app/logs
    networks:
      - medical-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  qdrant-data:
  hf-cache:
  app-logs:

networks:
  medical-net:
    driver: bridge
